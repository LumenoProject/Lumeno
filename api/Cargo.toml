[package]
name = "lumeno-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
db-tests = []

[dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
time = "0.3.44"
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
