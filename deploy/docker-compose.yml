name: lumeno

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumeno}
      POSTGRES_USER: ${POSTGRES_USER:-lumeno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  app:
    image: ${LUMENO_IMAGE:-ghcr.io/lumenoproject/lumeno:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      LUMENO_PUBLIC_URL: ${LUMENO_PUBLIC_URL:?set LUMENO_PUBLIC_URL in deploy/.env}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in deploy/.env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in deploy/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in deploy/.env}
      OIDC_TRUSTED_AUDIENCES: ${OIDC_TRUSTED_AUDIENCES:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-604800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-2592000}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?set NOTIFICATION_ENCRYPTION_KEY in deploy/.env}
      NOTIFICATION_ENDPOINT_ALLOWLIST: ${NOTIFICATION_ENDPOINT_ALLOWLIST:-}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      LUMENO_DOMAIN: ${LUMENO_DOMAIN:?set LUMENO_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
